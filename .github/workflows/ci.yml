name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Execução diária às 09:00 UTC, para detectar quebra causada pelo ambiente
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  api:
    name: Testes de API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-api
          path: api-serverest/playwright-report/
          retention-days: 15

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-e2e
          path: e2e-playwright/playwright-report/
          retention-days: 15

  bdd:
    name: Testes BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:bdd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-bdd
          path: bdd-cypress/cypress/screenshots/
          retention-days: 15
